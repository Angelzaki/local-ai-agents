[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-agents"
version = "0.1.0"
description = "Agentes locales con tools, memoria SQLite y abstención"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Angel Salazar" }]
dependencies = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "rich>=13.7.0",
]

[project.scripts]
local-agents = "local_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
